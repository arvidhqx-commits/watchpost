# WatchPost -- Ueberwachungskameras ohne NMS, ohne Entities, ohne authlib.
#
# Zum Nachlesen: waehrend des Kamerablicks ist der Spieler im Zuschauermodus.
# Der Zuschauermodus sieht durch Waende. Wer eine Kamera setzen darf, entscheidet
# also mit, wer wohin sehen kann -- vergib watchpost.camera.create bewusst.

view:
  # Nach so vielen Sekunden endet der Blick von selbst. 0 = ohne Zeitgrenze.
  max-seconds: 300
  # Nachtsicht waehrend des Blicks (wird beim Aussteigen wieder entfernt,
  # aber nur, wenn WatchPost sie selbst gesetzt hat).
  night-vision: true
  # Schleichen beendet den Blick.
  exit-on-sneak: true
  # Mausrad wechselt zur naechsten Kamera derselben Gruppe.
  switch-with-hotbar: true
  # Waehrend des Blicks sind fremde Befehle gesperrt (eigene bleiben erlaubt).
  block-commands: true

monitor:
  # Neu gesetzte Monitore sind fuer alle mit watchpost.monitor.use nutzbar.
  public-by-default: true

messages:
  help:
