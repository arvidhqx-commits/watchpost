    - "<gray>  /watchpost camera list | delete <name> | enable <name> | disable <name>"
    - "<gray>  /watchpost group create <name> | add <group> <camera> | list"
    - "<gray>  /watchpost monitor create <group>  (Block anschauen)"
    - "<gray>  /watchpost view <name> | next | prev | leave"
    - "<gray>  /watchpost import   (uebernimmt Daten von CCTV)"
  no-permission: "<red>Dazu fehlt dir die Berechtigung."
  reloaded: "<green>WatchPost neu geladen."
  viewing: "<green>Kamera <white>%camera%<green>. Schleichen beendet den Blick."
